name: RELEASE

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release-version:
    runs-on: ubuntu-latest
    if: github.actor == 'Escoto'
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'poetry'

      - name: Bump version
        id: bump
        run: |
          poetry version ${{ inputs.release_type }}
          version=$(poetry version -s)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sync __init__.py version
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"${{ steps.bump.outputs.version }}\"/" src/data_framework/__init__.py

      - name: Commit version bump to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${{ steps.bump.outputs.version }}"
          git add pyproject.toml src/data_framework/__init__.py
          git commit -m "chore: release v${{ steps.bump.outputs.version }}"
          git push origin "release/v${{ steps.bump.outputs.version }}"

      - name: Open release PR and enable auto-merge
        run: |
          pr_url=$(gh pr create \
            --base main \
            --head "release/v${{ steps.bump.outputs.version }}" \
            --title "chore: release v${{ steps.bump.outputs.version }}" \
            --body "Automated version bump to v${{ steps.bump.outputs.version }}. Tag and GitHub release are created automatically once this merges.")
          gh pr merge "$pr_url" --auto --squash
